<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <style>
    :root{--fg:#171726;--muted:#596174;--link:#6556e8;--border:#e1e4ec;--soft:#f6f7fc;}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);line-height:1.8;background:#fff;font-size:16px}
    a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}.wrap{max-width:820px;margin:auto;padding:0 22px}
    header{border-bottom:1px solid var(--border);background:#fff}.header-inner{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:700;color:var(--fg)}
    main{padding:34px 0 54px}h1{font-size:2em;line-height:1.35}h2{margin-top:1.8em;padding-bottom:.3em;border-bottom:1px solid var(--border);font-size:1.4em}h3{margin-top:1.5em;font-size:1.15em}
    img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:12px}blockquote{margin:1em 0;padding:.6em 1em;background:var(--soft);border-left:4px solid var(--link);color:var(--muted)}
    table{display:block;overflow-x:auto;border-collapse:collapse}th,td{border:1px solid var(--border);padding:8px 12px;text-align:left}th{background:var(--soft)}code{background:var(--soft);padding:.15em .35em;border-radius:4px}
    .cta{margin:32px 0;padding:22px;border-radius:14px;background:linear-gradient(135deg,#f2f1ff,#fff5f0);text-align:center}.cta a{display:inline-block;margin-top:8px;padding:10px 20px;border-radius:999px;background:#6556e8;color:#fff;font-weight:600}
    footer{border-top:1px solid var(--border);padding:26px 0;color:var(--muted);font-size:14px}.notice{margin-top:8px}
  </style>
</head>
<body>
  <header><div class="wrap header-inner"><a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a><a href="https://www.loveyouai.cn?ref=1221">查看充值套餐</a></div></header>
  <main><div class="wrap">{{ content }}<div class="cta"><strong>需要使用支付宝或微信充值？</strong><br><span>查看 LoveYouAI 当前套餐、实时价格与充值流程。</span><br><a href="https://www.loveyouai.cn?ref=1221">查看充值套餐</a></div></div></main>
  <footer><div class="wrap">© LoveYouAI 充值教程 · <a href="{{ '/' | relative_url }}">返回首页</a><div class="notice">本站为第三方教程与充值服务网站，并非 OpenAI 官方网站。产品功能、价格及地区支持以相关官方页面和商品页面实时信息为准。</div></div></footer>
</body>
</html>
